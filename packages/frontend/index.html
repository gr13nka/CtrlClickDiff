<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CtrlClickDiff</title>
    <style>
      :root {
        /* Surfaces */
        --ccd-canvas: #1e1e1e;
        --ccd-canvas-inset: #181818;
        --ccd-canvas-subtle: #262626;
        --ccd-control-bg: #252525;

        /* Borders */
        --ccd-border: #333;
        --ccd-border-strong: #3a3a3a;

        /* Text */
        --ccd-fg: #ccc;
        --ccd-fg-muted: #888;
        --ccd-fg-emphasis: #ddd;

        /* Accent (selection) */
        --ccd-accent-bg: #04395e;
        --ccd-accent-fg: #fff;

        /* Status (already GitHub Primer dark values) */
        --ccd-success: #3fb950;
        --ccd-attention: #d29922;
        --ccd-danger: #f85149;
        --ccd-on-badge: #0d1117;

        /* Metrics */
        --ccd-sidebar-w: 260px;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ccd-canvas);
      }

      /* Milestone 4 shell layout — sidebar (commit picker + changed-file
         list) + diff pane, built by shell.ts's initShell(). */
      #app.ccd-app {
        display: grid;
        grid-template-columns: var(--ccd-sidebar-w) 1fr;
        width: 100vw;
        height: 100vh;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--ccd-fg);
      }

      .ccd-sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--ccd-canvas-inset);
        border-right: 1px solid var(--ccd-border);
        overflow: hidden;
      }

      .ccd-picker {
        flex: 0 0 auto;
        padding: 10px 12px;
        border-bottom: 1px solid var(--ccd-border);
      }

      .ccd-label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ccd-fg-muted);
        margin-bottom: 4px;
      }

      .ccd-select {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        background: var(--ccd-control-bg);
        color: var(--ccd-fg-emphasis);
        border: 1px solid var(--ccd-border-strong);
        border-radius: 4px;
        font: inherit;
      }

      .ccd-status {
        flex: 0 0 auto;
        padding: 6px 12px;
        min-height: 1em;
        color: var(--ccd-fg-muted);
        font-size: 12px;
      }

      .ccd-file-list {
        flex: 1 1 auto;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        overflow-y: auto;
      }

      .ccd-file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }

      .ccd-file-row:hover {
        background: var(--ccd-canvas-subtle);
      }

      .ccd-file-row.active {
        background: var(--ccd-accent-bg);
        color: var(--ccd-accent-fg);
      }

      .ccd-badge {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 3px;
        font: 700 10px/1 ui-monospace, monospace;
        color: var(--ccd-on-badge);
      }

      .ccd-badge-A { background: var(--ccd-success); }
      .ccd-badge-M { background: var(--ccd-attention); }
      .ccd-badge-D { background: var(--ccd-danger); }

      /* min-width:0 is what makes the ellipsis actually render: as a flex item
         this defaults to min-width:auto, which refuses to shrink below its
         content width, so text-overflow never fires and the row's
         overflow:hidden just clips the path mid-glyph instead. */
      .ccd-file-path {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font: 12px ui-monospace, monospace;
      }

      .ccd-diff-pane {
        min-width: 0;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
