<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CtrlClickDiff</title>
    <style>
      :root {
        /* Surfaces */
        --ccd-canvas: #0d1117;
        --ccd-canvas-inset: #010409;
        --ccd-canvas-subtle: #161b22;
        --ccd-control-bg: #21262d;

        /* Borders */
        --ccd-border: #30363d;
        --ccd-border-strong: #30363d;

        /* Text */
        --ccd-fg: #e6edf3;
        --ccd-fg-muted: #8b949e;
        --ccd-fg-emphasis: #e6edf3;

        /* Accent (selection) */
        --ccd-accent-bg: #1f6feb;
        --ccd-accent-fg: #ffffff;

        /* Status (already GitHub Primer dark values) */
        --ccd-success: #3fb950;
        --ccd-attention: #d29922;
        --ccd-danger: #f85149;
        --ccd-on-badge: #0d1117;

        /* Overlay. The repo picker needs two roles no surface token covers: a
           dimmed backdrop and an elevation shadow. Both are translucent black
           rather than a surface colour on purpose — they read correctly over
           whatever the palette underneath becomes, so the pending Primer swap
           does not have to touch them. */
        --ccd-backdrop: rgb(0 0 0 / 55%);
        --ccd-shadow: rgb(0 0 0 / 45%);

        /* Shape. One radius scale and one hairline, so a control added later
           inherits the look instead of inventing a third rounding. The chrome
           deliberately reads quieter than the diff it frames: surfaces are
           separated by a hairline and a hover fill rather than by boxes and
           borders, which is what keeps the eye on the code. */
        --ccd-radius: 6px;
        --ccd-radius-lg: 10px;
        --ccd-hover: rgb(255 255 255 / 6%);
        --ccd-topbar-h: 44px;

        /* Metrics. The sidebar width is the live, draggable value (shell.ts
           overwrites it on #app); the -min/-max pair is the clamp the drag is
           held to, declared here so the numbers exist in exactly one place —
           initResizer() reads them back rather than repeating them. */
        --ccd-sidebar-w: 300px;
        --ccd-sidebar-w-min: 220px;
        --ccd-sidebar-w-max: 640px;
        /* Widest the review column grows to before it stops and centres, leaving
           canvas either side. Not a stylistic flourish: a diff read side by side
           is two columns of code, and past about this width a line of Kotlin has
           more empty space after it than text in it, while the eye has to travel
           the whole monitor to get from the left pane to the right one.

           This used to claim it was "wide enough that neither pane wraps at a
           normal font size". That was true of the fixture repos and false of
           real code: 1600px minus a 300px sidebar leaves 633px a pane, and this
           project's own shell.ts has lines of 899px, so every one of them was
           clipped. Wrapping is now on by default (diff.ts's viewOptions) and is
           what makes the cap safe — the cap decides how far the eye travels, and
           wrapping decides that nothing is lost when it stops. */
        --ccd-content-w-max: 1600px;
        /* Horizontal step per level of file-tree nesting. Deliberately smaller
           than the 12px gutter: at the 220px minimum sidebar width a depth-4
           row has to give the indent back to the filename. */
        --ccd-tree-indent: 10px;
        /* Resting height of a file card's sticky header. A *minimum*, not a
           fixed height: a long path wraps to a second line rather than being
           truncated past its filename. */
        --ccd-card-header-h: 32px;
        /* The band's own inset. A token rather than a literal because
           .ccd-card-header's sticky offset has to be its exact negative: a
           scroll container paints scrolled content over its padding, so a header
           pinned at the *content* edge leaves a strip of the previous lines
           showing above it. Same reasoning as initResizer reading its clamp
           bounds back from CSS instead of retyping them — two values that must
           agree should not be two literals. */
        --ccd-band-pad: 12px;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--ccd-canvas);
      }

      /* Shell layout, built by shell.ts's initShell(): a full-width header over
         a sidebar / resizer / diff-pane row.

         Two nested boxes rather than one grid, and the split is deliberate.
         #app owns the viewport and stacks header over content; .ccd-content owns
         the three columns. The header stays a sibling of the whole column group
         — not a cell beside the sidebar — because what it names scopes all of
         them: the files in the sidebar and the diff beside them belong to the
         repository, ref and commits it shows, so the sidebar must start below
         it. Separating the two is also what lets the content row be narrowed and
         centred without dragging the header in with it. */
      #app.ccd-app {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: var(--ccd-topbar-h) minmax(0, 1fr);
        width: 100vw;
        height: 100vh;
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--ccd-fg);
        /* Shows through as the gutter either side of the capped content column
           below. Inset rather than canvas, on the same rule as the sidebar and
           header: chrome recedes, code does not. */
        background: var(--ccd-canvas-inset);
      }

      /* The three-column row. --ccd-sidebar-w is written here by initResizer
         (shell.ts hands it this element), which is also why the drag maths is
         measured against this box: it is the one whose left edge the sidebar
         track starts at.

         Capped and centred, so on a wide monitor the review sits in the middle
         with canvas either side rather than being stretched to the bezels. The
         header above deliberately stays full-width and left-aligned: it names the
         repo, ref and commits, which is orientation rather than content, and
         indenting it to match would only push it away from the corner the eye
         already goes to. Below the cap this is a no-op — width:100% means a
         narrow window simply fills, with no horizontal scroll. */
      .ccd-content {
        display: grid;
        grid-template-columns: var(--ccd-sidebar-w) 6px minmax(0, 1fr);
        /* Local, as .ccd-modal does it — there is no global reset here. Required,
           not cosmetic: with the default content-box, width:100% plus the 1px
           borders below is 100% + 2px, which overflows the viewport horizontally
           the moment the window is narrower than the cap. */
        box-sizing: border-box;
        width: 100%;
        max-width: var(--ccd-content-w-max);
        margin-inline: auto;
        min-width: 0;
        min-height: 0;
        /* The seam between the gutter and the review, so the centred column reads
           as a surface rather than as content that happens to stop. */
        border-inline: 1px solid var(--ccd-border);
      }

      .ccd-topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 0 10px 0 8px;
        background: var(--ccd-canvas-inset);
        border-bottom: 1px solid var(--ccd-border);
      }

      /* Takes the slack so the view controls sit hard right, and min-width:0 so
         a long repo name ellipsises inside its chip instead of pushing them off
         the bar. */
      .ccd-trail {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        min-width: 0;
      }

      /* Each crumb may shrink, but never below a legible stub — otherwise a
         long repo name would starve the branch and commit crumbs beside it
         rather than ellipsising itself. */
      .ccd-crumb-slot {
        display: flex;
        min-width: 0;
        flex: 0 1 auto;
      }

      .ccd-crumb-sep {
        flex: 0 0 auto;
        padding: 0 2px;
        color: var(--ccd-fg-muted);
        opacity: 0.6;
      }

      /* Borderless until hovered: three bordered controls in a row read as a
         toolbar, where a breadcrumb should read as a sentence. The affordance
         is the hover fill and the pointer, which is enough for a control whose
         label is already the thing it changes. */
      .ccd-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        max-width: 100%;
        padding: 4px 8px;
        background: transparent;
        color: var(--ccd-fg);
        border: 0;
        border-radius: var(--ccd-radius);
        font: inherit;
        cursor: pointer;
      }

      .ccd-chip:hover {
        background: var(--ccd-hover);
      }

      .ccd-chip:focus-visible {
        outline: 2px solid var(--ccd-accent-bg);
        outline-offset: -1px;
      }

      .ccd-chip-icon {
        flex: 0 0 auto;
        color: var(--ccd-fg-muted);
        font-size: 11px;
      }

      /* Its own element rather than a bare text node: an anonymous flex item
         cannot take min-width:0, and without that the ellipsis never fires. */
      .ccd-chip-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ccd-topbar-actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .ccd-sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--ccd-canvas-inset);
        border-right: 1px solid var(--ccd-border);
        overflow: hidden;
      }

      /* Section label. Only the repo picker's "Recent" heading uses it now that
         the sidebar's two <select> pickers are gone. */
      .ccd-label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ccd-fg-muted);
        margin-bottom: 4px;
      }

      /* One inset surface around the pair rather than a border each, so the two
         buttons read as a single control with two states instead of two
         independent actions. overflow:hidden is what lets the outer radius clip
         the square corners of the segments inside it. */
      .ccd-segmented {
        flex: 0 0 auto;
        display: flex;
        padding: 2px;
        gap: 2px;
        background: var(--ccd-canvas-inset);
        border: 1px solid var(--ccd-border);
        border-radius: var(--ccd-radius);
        overflow: hidden;
      }

      .ccd-segment {
        padding: 2px 10px;
        background: transparent;
        color: var(--ccd-fg-muted);
        border: 0;
        border-radius: 4px;
        font: 11px/1.6 system-ui, sans-serif;
        white-space: nowrap;
        cursor: pointer;
      }

      .ccd-segment:hover {
        color: var(--ccd-fg-emphasis);
      }

      /* Selection is styled off aria-pressed rather than a class of its own:
         topbar.ts writes exactly one attribute per segment, so the button that
         looks selected cannot disagree with the one screen readers are told is.
         After the :hover rule on purpose — equal specificity, so this wins for
         a pressed segment under the cursor.

         A raised surface rather than the accent blue: this is a view mode, not
         a destination, and an accent-filled control on the header competes for
         attention with the diff it is describing. */
      .ccd-segment[aria-pressed='true'] {
        background: var(--ccd-control-bg);
        color: var(--ccd-fg-emphasis);
      }

      /* A <label> wrapping the box, so the text is part of the hit target —
         an 11px caption beside a 13px checkbox is otherwise a very small
         thing to aim at. */
      .ccd-check {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--ccd-fg-muted);
        font: 11px/1.4 system-ui, sans-serif;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }

      .ccd-check:hover {
        color: var(--ccd-fg-emphasis);
      }

      /* accent-color tints the native control instead of replacing it, which
         keeps the platform's own focus ring and checked glyph — a hand-rolled
         box would have to reimplement both to stay keyboard-usable. */
      .ccd-checkbox {
        width: 13px;
        height: 13px;
        margin: 0;
        accent-color: var(--ccd-accent-bg);
        cursor: pointer;
      }

      .ccd-status {
        flex: 0 0 auto;
        padding: 6px 12px;
        min-height: 1em;
        color: var(--ccd-fg-muted);
        font-size: 12px;
      }

      /* One slot carries progress and failure both, and at the muted grey above
         they were the same thing to look at: a request that had died read
         exactly like one still running. The word "Error" already leads every
         message that gets this class, so the colour is the redundant half and
         never the carrier — which is what keeps it working for a reader who
         cannot separate red from grey. */
      .ccd-status-error {
        color: var(--ccd-danger);
      }

      .ccd-file-list {
        flex: 1 1 auto;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        overflow-y: auto;
      }

      /* Nested list holding one directory's children. Zero padding of its own:
         indentation is the rows' business (see --ccd-depth below), because the
         UA's per-<ul> padding compounds and a Kotlin package path is four or
         five levels deep — enough to push the filename off a 220px sidebar
         before it has been read. */
      .ccd-subtree {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* Explicit, because the rule above would otherwise be free to out-rank
         the UA's `[hidden] { display: none }` and leave a collapsed directory
         showing its children. */
      .ccd-subtree[hidden] {
        display: none;
      }

      /* The two row kinds share one box so a directory and a file at the same
         depth line up. --ccd-depth is set per row by shell.ts; the longhand
         after the shorthand is what turns it into an indent. */
      .ccd-file-row,
      .ccd-dir-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        padding-left: calc(12px + var(--ccd-depth, 0) * var(--ccd-tree-indent));
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
      }

      .ccd-file-row:hover,
      .ccd-dir-row:hover {
        background: var(--ccd-canvas-subtle);
      }

      /* Both kinds of row are role=button + tabindex=0, so both need a ring.
         Inset, because a row is full-bleed against the sidebar edge and an
         outset outline would be clipped on the left by the overflow above. */
      .ccd-file-row:focus-visible,
      .ccd-dir-row:focus-visible {
        outline: 2px solid var(--ccd-accent-bg);
        outline-offset: -2px;
      }

      /* The file the band reports is at the top of the scroller.
         `active` is REPORTED, not chosen — shell.ts sets it from the band's
         IntersectionObserver, so it follows the reader's scroll rather than
         recording a click. It was a full-bleed accent fill with white text,
         which measured 4.08:1 against the canvas and made a passive position
         marker the single loudest element on a screen whose entire job is
         reading code: the diff it was pointing at is 1.20:1, so the pointer had
         over three times the contrast of the thing pointed to.
         Now a surface plus a 2px accent rule — 1.19:1 for the fill, with the
         rule itself at 3.7:1 doing the work in a few pixels. Same information,
         a twentieth of the ink, and it leaves the accent free to mean
         "something changed here" everywhere else. */
      .ccd-file-row.active {
        background: var(--ccd-canvas-subtle);
        box-shadow: inset 2px 0 0 var(--ccd-accent-bg);
        color: var(--ccd-fg-emphasis);
      }

      /* One glyph that rotates, rather than two glyphs swapped by JS: the only
         thing shell.ts writes on toggle is aria-expanded, so the arrow cannot
         disagree with the state a screen reader is told. */
      .ccd-twisty {
        flex: 0 0 auto;
        /* Matches .ccd-badge's width so a directory label and a file label at
           the same depth start at the same x. */
        width: 16px;
        text-align: center;
        color: var(--ccd-fg-muted);
        transition: transform 80ms ease;
      }

      .ccd-dir-row[aria-expanded='true'] .ccd-twisty {
        transform: rotate(90deg);
      }

      /* Same min-width:0 story as .ccd-file-path below, and it matters more
         here: a collapsed chain label is a whole path prefix
         ('src/main/kotlin/org/example') and is long by construction, so it must
         ellipsise rather than push the row wide. */
      .ccd-dir-name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font: 12px ui-monospace, monospace;
        color: var(--ccd-fg-emphasis);
      }

      .ccd-badge {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 3px;
        font: 700 10px/1 ui-monospace, monospace;
        color: var(--ccd-on-badge);
      }

      .ccd-badge-A { background: var(--ccd-success); }
      .ccd-badge-M { background: var(--ccd-attention); }
      .ccd-badge-D { background: var(--ccd-danger); }

      /* A reference card is not part of the change, so its badge is deliberately
         the quietest of the four — outlined rather than filled, in the muted
         foreground. It has to be legible without competing with A/M/D, which are
         the review itself. Wider than 16px because "ref" is three glyphs where
         the others are one. */
      .ccd-badge-context {
        width: auto;
        padding: 0 5px;
        background: transparent;
        border: 1px solid var(--ccd-border);
        color: var(--ccd-fg-muted);
        font-weight: 500;
      }

      /* min-width:0 is what makes the ellipsis actually render: as a flex item
         this defaults to min-width:auto, which refuses to shrink below its
         content width, so text-overflow never fires and the row's
         overflow:hidden just clips the path mid-glyph instead. */
      .ccd-file-path {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font: 12px ui-monospace, monospace;
      }

      /* Drag handle for the sidebar width (wired up by shell.ts's
         initResizer). It owns its own 6px grid track instead of floating over
         a neighbour, so the pointerdown can't be intercepted by whatever is
         underneath — which, on the right-hand side, is Monaco. Transparent at
         rest: the sidebar's own border-right is the seam you see, and the
         handle only announces itself via the cursor. */
      .ccd-resizer {
        background: transparent;
        cursor: col-resize;
        /* Required for pointer-event dragging on touch/pen: without it the
           browser claims the gesture for panning and sends pointercancel
           instead of pointermove. */
        touch-action: none;
      }

      .ccd-resizer:hover {
        background: var(--ccd-border);
      }

      /* Held highlight for the whole drag. :hover alone is not enough: the
         pointer routinely leaves the 6px track mid-drag (pointer capture keeps
         the drag alive anyway), which would blink the seam off at exactly the
         moment the feedback matters. */
      body.ccd-resizing .ccd-resizer {
        background: var(--ccd-border-strong);
      }

      /* Global drag state, set on <body> for the duration of a drag. The
         descendant selector and !important are load-bearing rather than
         sloppy: Monaco sets its own `cursor` on the view lines, margin and
         scrollbars, so without overriding them the cursor flickers between
         col-resize and text as the pointer crosses the diff. */
      body.ccd-resizing,
      body.ccd-resizing * {
        cursor: col-resize !important;
        user-select: none !important;
      }

      /* ------------------------------------------------------------------
         The review band (band.ts)

         Every changed file, stacked, in one scroll. This element is the app's
         only vertical scroll region: each card is exactly as tall as its
         editor's content (diff.ts's createFileDiff writes the height, and turns
         off scrollBeyondLastLine so "content" means content), and the editors
         are built with their own wheel handling and vertical scrollbar off so
         the gesture reaches this box instead of dying in a pane.

         position:relative is not decoration — it makes this the offsetParent for
         everything inside, which is the coordinate space band.ts's reveal maths
         converts line positions into.
         ------------------------------------------------------------------ */
      .ccd-band {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: var(--ccd-band-pad);
      }

      /* A review with nothing in it. Sits where the cards would be, because the
         column is where the reader is looking — this used to be one muted line
         in the corner of the sidebar beside 1290x850 of empty canvas.
         Left-aligned and narrow rather than centred in the void: the eye
         already starts at the left edge of this column, and a centred block
         would sit somewhere no other content ever does. */
      .ccd-band-empty {
        flex: 0 0 auto;
        max-width: 52ch;
        padding: 24px 4px;
      }

      .ccd-empty-title {
        margin: 0 0 8px;
        color: var(--ccd-fg-emphasis);
        font-size: 16px;
        font-weight: 600;
      }

      .ccd-empty-body {
        margin: 0 0 16px;
        color: var(--ccd-fg-muted);
        font-size: 13px;
        line-height: 1.5;
      }

      /* How big this review is, read once before the first card. Deliberately
         quiet — it is orientation, not content, so it sits at the muted colour
         and lets the diff below it be the loud thing. NOT sticky: the card
         headers own that edge, and two sticky layers would fight for it. */
      .ccd-band-summary {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 2px 4px 6px;
        color: var(--ccd-fg-muted);
        font-size: 12px;
      }

      .ccd-summary-count {
        color: var(--ccd-fg-emphasis);
        font-weight: 600;
      }

      .ccd-summary-group {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .ccd-summary-warn {
        color: var(--ccd-attention);
      }

      /* `+n −m` at the right end of a card header. Tabular figures so the two
         numbers do not jitter between cards as the reader scrolls past them. */
      .ccd-card-churn {
        flex: 0 0 auto;
        display: flex;
        gap: 6px;
        font: 11px ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }

      /* The same green and red as the lines they count. The sign is written out
         rather than left to the colour, so the pair still reads when the colour
         does not — printed, dimmed, or by a reader who cannot separate the two. */
      .ccd-churn-add { color: var(--ccd-success); }
      .ccd-churn-del { color: var(--ccd-danger); }

      /* NO `overflow` here, and that absence is load-bearing. Any overflow other
         than `visible` gives an element a scrolling box, and a sticky descendant
         sticks within its NEAREST such box — so `overflow: hidden` on the card
         made the card its own header's scrollport, and since a card never
         scrolls, `top: 0` resolved to the card's own top and the header rode
         away with it. Measured before the fix: header top at scrollTop
         400/1400/2400 was -343/-1343/-2343, i.e. never pinned once. The clip
         that rounds the editor's square corners lives on .ccd-card-body instead,
         which is not an ancestor of the header. */
      .ccd-card {
        border: 1px solid var(--ccd-border);
        border-radius: var(--ccd-radius-lg);
        background: var(--ccd-canvas);
        /* Stops a flex item from being squeezed below its content height — the
           heights here are computed, and flex must not renegotiate them. */
        flex: 0 0 auto;
      }

      /* A reference card sits in the same column as the review but is not part of
         it, and the border is where that reads fastest — a dashed edge says
         "provisional" before any label is read. Kept to the border alone: dimming
         the whole card would make the code harder to read, which is the one thing
         the reader opened it for. */
      .ccd-card-context {
        border-style: dashed;
      }

      /* Sticky, so the path stays readable while its own diff scrolls past. The
         z-index keeps it over Monaco's line content; the opaque background is
         what makes the code slide under it rather than through it.

         The radius is written here rather than inherited through a clip on the
         card, because that clip is what stopped this from sticking at all — see
         .ccd-card. Inset by the card's 1px border so the two curves are
         concentric instead of the header's corner cutting the border's. */
      .ccd-card-header {
        position: sticky;
        /* The band's padding, negated — see --ccd-band-pad. Pins the header to
           the scrollport's edge instead of its content edge, so no strip of the
           lines above it shows through while it is stuck. */
        top: calc(-1 * var(--ccd-band-pad));
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: var(--ccd-card-header-h);
        padding: 5px 10px;
        background: var(--ccd-canvas-subtle);
        border-bottom: 1px solid var(--ccd-border);
        border-radius: calc(var(--ccd-radius-lg) - 1px) calc(var(--ccd-radius-lg) - 1px) 0 0;
      }

      /* Collapsed, the header IS the card, so it carries all four corners. */
      .ccd-card.collapsed .ccd-card-header {
        border-bottom: none;
        border-radius: calc(var(--ccd-radius-lg) - 1px);
      }

      .ccd-card-twisty {
        flex: 0 0 auto;
        width: 18px;
        padding: 0;
        border: 0;
        border-radius: var(--ccd-radius);
        background: transparent;
        color: var(--ccd-fg-muted);
        font-size: 11px;
        line-height: 18px;
        cursor: pointer;
        transition: transform 80ms ease-out;
      }

      .ccd-card-twisty:hover {
        background: var(--ccd-hover);
        color: var(--ccd-fg);
      }

      .ccd-card-twisty[aria-expanded='false'] {
        transform: rotate(-90deg);
      }

      /* The full path, because a band has no sidebar selection to say which file
         you are looking at.

         It WRAPS rather than ellipsising, and that is the deliberate choice: a
         Kotlin source path is mostly package directories with the one
         identifying part — the filename — at the very end, so truncating the end
         hides exactly what the reader needs and truncating the front needs an
         rtl trick that reorders the two spans below. Two lines occasionally is
         cheaper than a name you cannot read. min-height on the header rather
         than height is what lets it. */
      .ccd-card-path {
        flex: 1 1 auto;
        min-width: 0;
        font: 12px ui-monospace, monospace;
        overflow-wrap: anywhere;
      }

      /* Directory dim, basename bright: read as one flat string, a deep path
         buries the only part that identifies the file. */
      .ccd-card-dir {
        color: var(--ccd-fg-muted);
      }

      .ccd-card-name {
        color: var(--ccd-fg-emphasis);
        font-weight: 600;
      }

      /* Monaco paints its ALIGNMENT SPACERS with the removed-line gutter colour,
         so a block of purely added lines gets a red bar down its left edge —
         "added" and "deleted" claimed about the same rows at once.

         These spacers are the margin view zones Monaco inserts where one side
         has no line to put opposite the other, which beside an addition is
         every row of it: measured on band.ts, ten of them. A real deletion is a
         different element (`cmdr gutter-delete`, and in inline mode
         `inline-deleted-margin-view-zone`), so scoping to the view-zone
         container keeps the red where something really was removed and takes it
         off the rows where nothing was.

         Targeting Monaco's internals is a last resort and this is one: the
         colour comes from `diffEditorGutter.removedLineBackground`, which the
         spacer and the real deletion share, so there is no theme key that
         separates them. Same call peekscope.ts makes for the peek list. */
      .ccd-card .margin-view-zones > .gutter-delete {
        background: transparent;
      }

      .ccd-card-body {
        /* Height is written in px by diff.ts. Nothing here may fight it. */
        min-width: 0;
        /* Rounds the editor's square bottom corners off. This is the clip that
           used to sit on .ccd-card; it works the same from here and, unlike
           there, it is not an ancestor of the sticky header. Safe for the same
           reason it was safe before: the only widgets that would overflow are
           hovers and suggests, and createFileDiff sets fixedOverflowWidgets so
           those render against <body>; peek is a zone widget living inline in
           the content, so the card grows for it rather than clipping it. */
        overflow: hidden;
        border-radius: 0 0 calc(var(--ccd-radius-lg) - 1px) calc(var(--ccd-radius-lg) - 1px);
      }

      /* Placeholder text for a card whose editor has not arrived yet. On the
         ::after rather than as a child node, so the loading state cannot collide
         with the element Monaco is about to mount into. */
      .ccd-card.loading .ccd-card-body::after {
        content: 'Loading…';
        display: block;
        padding: 10px 12px;
        color: var(--ccd-fg-muted);
        font-size: 12px;
      }

      /* ------------------------------------------------------------------
         Repo picker modal (repopicker.ts)

         Appended to <body>, not into the sidebar, for two reasons: a directory
         browser has to show paths and the sidebar is 220-640px wide, and #app's
         grid would otherwise have to make room for it. Being outside #app also
         means none of #app.ccd-app's inherited font and colour reach it, which
         is why .ccd-modal restates both.
         ------------------------------------------------------------------ */
      .ccd-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ccd-backdrop);
      }

      .ccd-modal {
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-sizing: border-box;
        width: min(680px, 90vw);
        max-height: min(560px, 82vh);
        padding: 14px 16px;
        background: var(--ccd-canvas);
        border: 1px solid var(--ccd-border-strong);
        border-radius: 6px;
        box-shadow: 0 12px 32px var(--ccd-shadow);
        font: 13px/1.4 system-ui, sans-serif;
        color: var(--ccd-fg);
      }

      .ccd-modal-title {
        flex: 0 0 auto;
        font-size: 14px;
        color: var(--ccd-fg-emphasis);
      }

      /* ------------------------------------------------------------------
         Commit palette (commitpalette.ts)

         A .ccd-modal variant, not a second modal: it shares the backdrop, the
         panel, the shadow and the dismissal rules, and differs only in being a
         search-over-a-list rather than a form. Zero padding of its own so the
         search box and the rows can run edge to edge — a full-bleed row is what
         makes a long list read as a list rather than as a stack of cards.
         ------------------------------------------------------------------ */
      .ccd-palette {
        width: min(720px, 92vw);
        max-height: min(70vh, 640px);
        padding: 0;
        gap: 0;
        border-radius: var(--ccd-radius-lg);
        overflow: hidden;
      }

      .ccd-palette-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--ccd-border);
      }

      /* Borderless and transparent: the panel edge already frames it, and a
         second box inside a box is the look this replaced. */
      .ccd-palette-search {
        flex: 1 1 auto;
        min-width: 0;
        padding: 2px 0;
        background: transparent;
        color: var(--ccd-fg-emphasis);
        border: 0;
        outline: none;
        font: 14px/1.4 system-ui, sans-serif;
      }

      .ccd-palette-search::placeholder {
        color: var(--ccd-fg-muted);
      }

      /* Ghost squash mode row — between the search box and the list, because it
         changes what clicking a row means and the reader has to meet it before
         they click one. */
      .ccd-palette-mode {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--ccd-border);
      }

      .ccd-ghost-toggle {
        padding: 3px 10px;
        background: var(--ccd-control-bg);
        color: var(--ccd-fg-muted);
        border: 1px solid var(--ccd-border);
        border-radius: 999px;
        font: 11px/1.5 system-ui, sans-serif;
        cursor: pointer;
        white-space: nowrap;
      }

      .ccd-ghost-toggle:hover {
        color: var(--ccd-fg-emphasis);
      }

      /* Armed state is accent-filled, unlike the header's view toggles: this one
         changes what the app is showing, not how it is drawn, and it has to be
         legible at a glance from across the panel. */
      .ccd-ghost-toggle[aria-pressed='true'] {
        background: var(--ccd-accent-bg);
        color: var(--ccd-accent-fg);
        border-color: var(--ccd-accent-bg);
      }

      .ccd-info-btn {
        width: 18px;
        height: 18px;
        padding: 0;
        background: transparent;
        color: var(--ccd-fg-muted);
        border: 0;
        border-radius: 50%;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }

      .ccd-info-btn:hover {
        color: var(--ccd-fg-emphasis);
        background: var(--ccd-hover);
      }

      .ccd-palette-mode-hint {
        color: var(--ccd-fg-muted);
        font-size: 11px;
      }

      /* white-space: pre-line so the paragraph breaks written into the string
         survive — the explainer is three points, not one run-on sentence. */
      .ccd-palette-explainer {
        flex: 0 0 auto;
        margin: 0;
        padding: 10px 14px;
        background: var(--ccd-canvas-inset);
        border-bottom: 1px solid var(--ccd-border);
        color: var(--ccd-fg-muted);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-line;
      }

      .ccd-palette-list {
        flex: 1 1 auto;
        margin: 0;
        padding: 6px;
        list-style: none;
        overflow-y: auto;
        min-height: 0;
      }

      /* Ghost mode gives every row a tick column ahead of the sha. Declared on
         the panel rather than the row so one class flip re-columns the whole
         list, and so a row cannot end up with a box and no column for it. */
      .ccd-palette.ghost .ccd-palette-row {
        grid-template-columns: 16px 7ch minmax(0, 1fr) auto;
      }

      .ccd-palette-tick {
        width: 13px;
        height: 13px;
        box-sizing: border-box;
        align-self: center;
        border: 1px solid var(--ccd-border-strong);
        border-radius: 3px;
      }

      /* Drawn from the row's .selected class, so the box that looks ticked
         cannot disagree with the row that is — there is no second copy of the
         state to keep in step. */
      .ccd-palette-row.selected .ccd-palette-tick {
        background: var(--ccd-accent-bg);
        border-color: var(--ccd-accent-bg);
      }

      /* The check itself: two adjacent borders on an empty box, rotated 45deg,
         which is the one construction that gives a real tick's short-then-long
         stroke. Drawn rather than typed so it cannot be selected, copied, or
         read out as text — the row's aria-selected already states it. */
      .ccd-palette-row.selected .ccd-palette-tick::after {
        content: '';
        display: block;
        width: 3px;
        height: 7px;
        margin: 0 auto;
        border: solid var(--ccd-accent-fg);
        border-width: 0 2px 2px 0;
        transform: translateY(-1px) rotate(45deg);
      }

      /* Grid, not flex: the sha column is fixed so every row's subject starts at
         the same x, which is what lets the eye run straight down the subjects
         instead of tracking a ragged left edge. The subject takes the slack and
         the meta column sizes to its content. */
      .ccd-palette-row {
        display: grid;
        grid-template-columns: 7ch minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 10px;
        padding: 6px 8px;
        border-radius: var(--ccd-radius);
        cursor: pointer;
      }

      /* Keyboard and mouse share one highlight. The list is driven from the
         search box, so there is no focus ring to fall back on — .active IS the
         cursor, and it has to be visible enough to be one. */
      .ccd-palette-row:hover,
      .ccd-palette-row.active {
        background: var(--ccd-hover);
      }

      .ccd-palette-row.selected {
        background: color-mix(in srgb, var(--ccd-accent-bg) 22%, transparent);
      }

      .ccd-palette-row.selected.active {
        background: color-mix(in srgb, var(--ccd-accent-bg) 38%, transparent);
      }

      .ccd-palette-sha {
        color: var(--ccd-fg-muted);
        font: 12px ui-monospace, monospace;
      }

      .ccd-palette-subject {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ccd-fg-emphasis);
      }

      .ccd-palette-meta {
        color: var(--ccd-fg-muted);
        font-size: 11px;
        white-space: nowrap;
      }

      /* Spans the full row so it lands under the subject rather than squeezing
         the grid's three columns into four. */
      .ccd-palette-badge {
        grid-column: 2 / -1;
        justify-self: start;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--ccd-control-bg);
        color: var(--ccd-attention);
        font-size: 10px;
      }

      /* Section label inside the branch palette's list. A row of the <ul> rather
         than a wrapper, so filtering can drop it with its group and never leave
         a header standing over nothing. */
      .ccd-palette-group {
        padding: 10px 8px 4px;
        color: var(--ccd-fg-muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      /* The branch palette has no sha column to fill, so its marker column is
         narrow and the name takes what the commit palette gives to the subject. */
      .ccd-branch-row {
        grid-template-columns: 2ch minmax(0, 1fr) auto;
      }

      .ccd-palette-empty {
        padding: 18px 10px;
        color: var(--ccd-fg-muted);
        text-align: center;
      }

      .ccd-palette-foot {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-top: 1px solid var(--ccd-border);
        background: var(--ccd-canvas-inset);
      }

      .ccd-palette-hint {
        flex: 1 1 auto;
        min-width: 0;
        color: var(--ccd-fg-muted);
        font-size: 11px;
      }

      /* The ⚠ on a changed-file row: this file's diff carries edits from commits
         the reviewer left out. Attention amber rather than danger red — nothing
         is broken, the preview is simply wider than what was asked for. */
      .ccd-file-warn {
        flex: 0 0 auto;
        color: var(--ccd-attention);
        font-size: 11px;
        cursor: help;
      }

      .ccd-recents {
        flex: 0 0 auto;
      }

      .ccd-recent-list,
      .ccd-browse-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .ccd-recent-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
        padding: 3px 6px;
        background: transparent;
        border: 0;
        border-radius: 3px;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .ccd-recent-row:hover {
        background: var(--ccd-canvas-subtle);
      }

      .ccd-recent-name {
        flex: 0 0 auto;
        color: var(--ccd-fg-emphasis);
        font: 12px ui-monospace, monospace;
      }

      /* The path is what tells two checkouts with the same basename apart, so it
         is shown rather than tooltipped — truncated from the right when it must
         be, since the tail is the distinguishing half. */
      .ccd-recent-path {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ccd-fg-muted);
        font-size: 11px;
      }

      .ccd-modal-nav {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        min-width: 0;
      }

      /* Scrolls rather than wraps: a deep path that wrapped would change the
         modal's height on every step into a directory. */
      .ccd-crumbs {
        display: flex;
        align-items: center;
        min-width: 0;
        overflow-x: auto;
      }

      .ccd-crumb {
        flex: 0 0 auto;
        padding: 2px 4px;
        background: transparent;
        border: 0;
        border-radius: 3px;
        color: var(--ccd-fg);
        font: 12px ui-monospace, monospace;
        white-space: nowrap;
        cursor: pointer;
      }

      .ccd-crumb:hover {
        background: var(--ccd-canvas-subtle);
        color: var(--ccd-fg-emphasis);
      }

      /* Separators as generated content, so the crumb list stays exactly one
         element per directory and nothing has to clean up stray '/' nodes. */
      .ccd-crumb + .ccd-crumb::before {
        content: '/';
        margin-right: 4px;
        color: var(--ccd-fg-muted);
      }

      .ccd-icon-btn {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 3px;
        color: var(--ccd-fg-muted);
        font: inherit;
        cursor: pointer;
      }

      .ccd-icon-btn:hover:not(:disabled) {
        background: var(--ccd-canvas-subtle);
        color: var(--ccd-fg-emphasis);
      }

      .ccd-icon-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .ccd-browse-list {
        flex: 1 1 auto;
        min-height: 140px;
        overflow-y: auto;
        background: var(--ccd-canvas-inset);
        border: 1px solid var(--ccd-border);
        border-radius: 4px;
      }

      .ccd-browse-item {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-right: 4px;
      }

      .ccd-browse-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 auto;
        min-width: 0;
        padding: 4px 8px;
        background: transparent;
        border: 0;
        border-radius: 3px;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .ccd-browse-row:hover {
        background: var(--ccd-canvas-subtle);
      }

      /* Same treatment the active file row gets, for the same reason: selection
         is the state the Open button reads, so it has to be unmistakable. */
      .ccd-browse-row.selected {
        background: var(--ccd-accent-bg);
        color: var(--ccd-accent-fg);
      }

      .ccd-browse-name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 12px ui-monospace, monospace;
      }

      .ccd-repo-badge {
        flex: 0 0 auto;
        padding: 0 5px;
        border-radius: 3px;
        background: var(--ccd-success);
        color: var(--ccd-on-badge);
        font: 700 10px/16px ui-monospace, monospace;
      }

      .ccd-browse-empty {
        padding: 8px;
        color: var(--ccd-fg-muted);
      }

      .ccd-modal-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .ccd-modal-msg {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ccd-fg-muted);
        font-size: 12px;
      }

      .ccd-btn {
        flex: 0 0 auto;
        padding: 4px 12px;
        background: var(--ccd-control-bg);
        color: var(--ccd-fg-emphasis);
        border: 1px solid var(--ccd-border-strong);
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }

      .ccd-btn:hover:not(:disabled) {
        background: var(--ccd-canvas-subtle);
      }

      .ccd-btn:disabled {
        color: var(--ccd-fg-muted);
        cursor: default;
      }

      .ccd-btn-primary:not(:disabled) {
        background: var(--ccd-accent-bg);
        color: var(--ccd-accent-fg);
        border-color: var(--ccd-accent-bg);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
